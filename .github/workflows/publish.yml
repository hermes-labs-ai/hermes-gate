name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Serialize the version check and upload across release tags.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/hermes-gate/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version parser
        run: python -m pip install packaging
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      # Runs after environment approval, against the actual downloaded artifact.
      - name: Reject superseded package
        run: python .github/scripts/check_pypi_version.py
      - uses: pypa/gh-action-pypi-publish@release/v1
