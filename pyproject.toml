[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gate"
version = "0.1.4"
description = "Bounded, receipt-bound completion rail for coding sessions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Hermes Labs", email = "roli@hermes-labs.ai" }]
keywords = [
    "ai-agents",
    "coding-agent",
    "completion-gate",
    "ci",
    "developer-tools",
    "hermes-labs",
    "quality-assurance",
    "receipts",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://hermes-labs.ai/open-source"
Repository = "https://github.com/hermes-labs-ai/hermes-gate"
Issues = "https://github.com/hermes-labs-ai/hermes-gate/issues"
Changelog = "https://github.com/hermes-labs-ai/hermes-gate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.15.22", "build==1.5.0"]

[project.scripts]
hermes-gate = "hermes_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_gate = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
